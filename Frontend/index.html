    <!-- Security: Console Protection (Production Only) -->
    <script>
      (function () {
        "use strict";

        // Only run in production
        if (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        ) {
          return;
        }

        // ============================================
        // CONSOLE PASTE WARNING
        // ============================================
        let pasteWarningShown = false;

        // Monitor console opening
        const showPasteWarning = () => {
          if (pasteWarningShown) return;
          pasteWarningShown = true;

          console.log(
            "%c⚠️ STOP! ⚠️",
            "color: red; font-size: 50px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);"
          );
          console.log(
            "%cThis is a browser feature intended for developers.",
            "font-size: 18px; font-weight: bold;"
          );
          console.log(
            "%cIf someone told you to copy-paste something here, it's a scam designed to steal your account.",
            "font-size: 16px; color: #ff6b6b;"
          );
          console.log(
            "%cPasting code here can give attackers access to your RankBaaz account.",
            "font-size: 16px; color: #ff6b6b; font-weight: bold;"
          );
        };

        // Show warning when DevTools opens
        let devtoolsOpen = false;
        const checkDevTools = () => {
          const threshold = 160;
          const widthThreshold =
            window.outerWidth - window.innerWidth > threshold;
          const heightThreshold =
            window.outerHeight - window.innerHeight > threshold;

          if ((widthThreshold || heightThreshold) && !devtoolsOpen) {
            devtoolsOpen = true;
            showPasteWarning();
          }
        };

        // Check periodically
        setInterval(checkDevTools, 1000);

        // Also show on first console.log
        const originalLog = console.log;
        console.log = function () {
          showPasteWarning();
          console.log = originalLog; // Restore original after first use
          return originalLog.apply(console, arguments);
        };

        // ============================================
        // SECURITY: Block Malicious Console Commands
        // ============================================

        // Prevent beforeunload hijacking
        const originalBeforeUnload = window.onbeforeunload;
        Object.defineProperty(window, "onbeforeunload", {
          configurable: false,
          enumerable: false,
          get: () => originalBeforeUnload,
          set: (value) => {
            // Only allow our own code to set this
            const stack = new Error().stack;
            if (stack && stack.includes("Test.jsx")) {
              return value;
            }
            console.warn("Not Allowed");
            return originalBeforeUnload;
          },
        });

        // Protect console.clear
        console.clear = () => console.warn("Not Allowed");

        // Protect location methods
        ["assign", "replace", "reload"].forEach((method) => {
          const original = window.location[method];
          Object.defineProperty(window.location, method, {
            configurable: false,
            enumerable: false,
            value: function () {
              const stack = new Error().stack;
              // Allow only from our own React Router code
              if (
                stack &&
                (stack.includes("react-router") ||
                  stack.includes("useNavigate"))
              ) {
                return original.apply(this, arguments);
              }
              console.warn("Not Allowed");
              return false;
            },
          });
        });

        // Protect history methods
        const originalPushState = history.pushState;
        const originalReplaceState = history.replaceState;

        history.pushState = function () {
          const stack = new Error().stack;
          if (stack && stack.includes("react-router")) {
            return originalPushState.apply(this, arguments);
          }
          console.warn("Not Allowed");
          return false;
        };

        history.replaceState = function () {
          const stack = new Error().stack;
          if (stack && stack.includes("react-router")) {
            return originalReplaceState.apply(this, arguments);
          }
          console.warn("Not Allowed");
          return false;
        };

        // Protect window.onerror (but allow React's error handling)
        const originalOnError = window.onerror;
        Object.defineProperty(window, "onerror", {
          configurable: false,
          enumerable: false,
          get: () => originalOnError,
          set: (value) => {
            const stack = new Error().stack;
            if (
              stack &&
              (stack.includes("react") || stack.includes("ErrorBoundary"))
            ) {
              return value;
            }
            console.warn("Not Allowed");
            return originalOnError;
          },
        });

        // Prevent Razorpay modal hijacking
        const originalRazorpay = window.Razorpay;
        if (originalRazorpay) {
          window.Razorpay = function () {
            const stack = new Error().stack;
            if (stack && stack.includes("PaymentModal")) {
              return originalRazorpay.apply(this, arguments);
            }
            console.warn("Not Allowed");
            return null;
          };
        }
      })();
    </script>
