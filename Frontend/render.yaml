services:
  - type: web
    name: vidhgrow
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist

    routes:
      - type: redirect
        source: /teachers
        destination: /teacher
      - type: redirect
        source: /teachers/
        destination: /teacher
      - type: redirect
        source: /teacher/
        destination: /teacher
      - type: rewrite
        source: /teacher
        destination: /teacher/index.html
      - type: redirect
        source: /profile/:username/
        destination: /profile/:username
      - type: rewrite
        source: /profile/:username
        destination: /profile/:username.html
      - type: redirect
        source: /tests/:slug/
        destination: /tests/:slug
      - type: rewrite
        source: /tests/:slug
        destination: /tests/:slug.html
      - type: rewrite
        source: /tests
        destination: /tests.html
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Cache images for 1 day
      - path: "*.png"
        name: Cache-Control
        value: public, max-age=86400

      - path: "*.jpg"
        name: Cache-Control
        value: public, max-age=86400

      - path: "*.jpeg"
        name: Cache-Control
        value: public, max-age=86400

      - path: "*.webp"
        name: Cache-Control
        value: public, max-age=86400

      - path: "*.svg"
        name: Cache-Control
        value: public, max-age=86400

      - path: "*.gif"
        name: Cache-Control
        value: public, max-age=86400

      # Cache JS/CSS for 1 day
      - path: "/assets/*"
        name: Cache-Control
        value: public, max-age=86400

      - path: "/sitemap*.xml"
        name: Cache-Control
        value: public, max-age=3600
